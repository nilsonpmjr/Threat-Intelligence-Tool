# Fake extension — exists only to validate that the extensions
# platform (Fase 4) is generic. No `socc` keyword anywhere in this
# file. PRD §Phase 4 done criteria: "framework aceita nova extensão
# (teste: adicionar manifest fake + compose trivial e ver card
# renderizar)".
#
# To remove from the catalog at any time: `rm -rf backend/extensions/fake`
# and restart the backend (or call ExtensionManager.reload()).

id: fake
name: Generality Probe
description: Trivial extension used to prove the platform isn't hard-coded.
version: 0.1.0
compose_file: ./compose.yml
operations: [install, start, stop, restart, logs, uninstall]

health:
  url: http://fake-probe:80/
  interval_seconds: 30
  timeout_seconds: 3

secrets: []

requires:
  docker_socket_proxy: true
  disk_space_mb: 16
  ports: []

settings:
  - key: PROBE_MESSAGE
    type: string
    default: "hello from the fake extension"
    label: Greeting message

uninstall:
  destroy_volumes_by_default: false
  confirm_phrase: "uninstall fake"
